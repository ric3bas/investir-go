# ============================================================================
# InvestirGo - Docker Compose de Produção
# Isolamento de rede, containers não-root, segredos e volumes seguros
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: investirgo-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investir_db}
      POSTGRES_USER: ${POSTGRES_USER:-investir_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/01_auth_schema.sql:/docker-entrypoint-initdb.d/zz_auth_schema.sql:ro
    networks:
      - backend-network
    # A porta NÃO é exposta para o host/internet, garantindo isolamento total
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Backend API (.NET 10 Web API)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investirgo-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5050
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-investir_db};Username=${POSTGRES_USER:-investir_app};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      Security__EnforceHttps: "true"
      Security__AppUrl: ${APP_URL:-https://investirgo.com}
      Security__Jwt__SecretKey: ${SECURITY__JWT__SECRETKEY:?Defina SECURITY__JWT__SECRETKEY no .env}
      Security__Jwt__Issuer: InvestirGo
      Security__Jwt__Audience: InvestirGoClient
      Security__Jwt__AccessTokenLifetimeMinutes: "10"
      Security__Totp__EncryptionKeyBase64: ${SECURITY__TOTP__ENCRYPTIONKEYBASE64:?Defina SECURITY__TOTP__ENCRYPTIONKEYBASE64 no .env}
      Security__AllowedOrigins__0: ${APP_URL:-https://investirgo.com}
      MarketData__BrapiKey: ${BRAPI_KEY:?Defina BRAPI_KEY no .env}
    volumes:
      - data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - backend-network
      - frontend-network
    expose:
      - "5050"

  # --------------------------------------------------------------------------
  # 3. Proxy Reverso Nginx com Terminação TLS e HSTS
  # --------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: investirgo-proxy-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certs_data:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - frontend-network

networks:
  backend-network:
    internal: true # Rede estritamente isolada sem acesso direto à internet
  frontend-network:

volumes:
  postgres_prod_data:
  data_protection_keys:
  certs_data:
  certbot_data:
