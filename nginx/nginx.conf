# ============================================================================
# InvestirGo - Configuração de Produção Nginx com Terminação TLS Moderna
# Em conformidade com as diretrizes da OWASP e Mozilla SSL Configuration Generator
# ============================================================================

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Oculta versão do Nginx nos cabeçalhos de resposta (Information Disclosure)
    server_tokens off;

    # Otimização de performance e buffers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5M;

    # Limitação de taxa no Proxy Reverso (Defesa em Profundidade contra DDoS e Brute Force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Formato de log estruturado omitindo cabeçalhos sensíveis (Authorization, Cookie)
    log_format security_combined '$remote_addr - $remote_user [$time_local] '
                                 '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'rt=$request_time';

    access_log /var/log/nginx/access.log security_combined;
    error_log /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------------
    # 1. Redirecionamento Mandatório HTTP -> HTTPS (Porta 80 -> 443)
    # ------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name investirgo.com www.investirgo.com;

        # Desafio ACME Let's Encrypt para renovação automatizada de certificados
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirecionamento permanente para HTTPS com preservação de caminho
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------------
    # 2. Servidor Principal HTTPS (TLS Moderno - Porta 443)
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name investirgo.com www.investirgo.com;

        # Certificados TLS
        ssl_certificate /etc/letsencrypt/live/investirgo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/investirgo.com/privkey.pem;

        # Protocolos TLS estritamente modernos (TLSv1.2 e TLSv1.3 - rejeita SSLv3, TLS 1.0 e 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Ciphers Modernos com Perfect Forward Secrecy (PFS)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Sessões e Otimização TLS
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling (Validação de revogação de certificado)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/investirgo.com/chain.pem;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # --------------------------------------------------------------------
        # Cabeçalhos de Segurança Globais na Infraestrutura
        # --------------------------------------------------------------------
        # HSTS com preload e inclusão de subdomínios (1 ano)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # --------------------------------------------------------------------
        # Frontend SPA Estático
        # --------------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Cache com integridade para ativos estáticos com hash
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --------------------------------------------------------------------
        # API Backend (.NET 10 Web API)
        # --------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend:5050;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Cabeçalhos Forwarded Confiáveis para o ASP.NET Core
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Restrição específica de taxa para endpoints de autenticação
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend:5050;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Garante ausência de cache intermediário
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }
    }
}
