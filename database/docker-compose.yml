services:
  postgres:
    image: postgres:16-alpine
    container_name: investir-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: investir_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_investir_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_investir_data:
